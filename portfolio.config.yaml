# ── Projects ───────────────────────────────────────────────────────────
# Set featured: true to show in the Featured section (max 3 recommended)
projects:
  - name: "PPA Scout"
    description: "A website that helps NYSC corps members in Nigeria find their Place of Primary Assignment (PPA). You can search and filter through companies, schools, and organizations, or add a new one if you know a place that's missing. I built it with plain HTML, CSS (Flexbox and Grid), and JavaScript, with no frameworks or libraries. It currently runs on sample data, so it works as a demo for now."
    tags: [HTML5, CSS3, JavaScript]
    liveUrl: "https://ppa-scout-ng.netlify.app/"
    repoUrl: "https://github.com/rihanat1/ppa-scout"
    featured: true

  - name: "RIRISLUXEEATS"
    description: "A restaurant website where you can explore dishes from around the world, filter by cuisine, and build up a cart. Browsing is open to everyone. Nobody has to make an account until they actually check out, and their details stay saved in the browser through localStorage. I built it with React, Vite, Tailwind CSS, React Router, and the Context API. The recipes come from the DummyJSON Recipes API. One problem I ran into was that the API is slow on mobile, and the menu sat empty for too long. To fix that, I bundled 30 featured dishes into the app so the menu appears instantly. The full list from the API gets merged in once it finishes loading, and if the API ever fails, the built in dishes keep the menu working."
    tags: [React.js, Vite, Tailwind CSS, React Router, Axios]
    liveUrl: "https://ririsluxeeats.netlify.app/"
    repoUrl: "https://github.com/rihanat1/RIRIsLuxeEats"
    featured: true

  - name: "YAISHA"
    description: "A landing page I built using react.js and tailwind css for a real client, a professional hairstylist. I designed it from scratch around her instructions for how she wanted the site to look and feel. It has a hero section with a booking button, an about section, a services showcase, client reviews, and her contact details. The black and gold theme was her request, to match her brand. Booking links go out to her existing Canva payment pages."
    tags: [React.js, Tailwind CSS]
    liveUrl: "https://madebyyaisha.com/"
    repoUrl: "https://github.com/rihanat1/YAISHA"
    featured: true


